[package]
name = "unioncrax-direct"
version = "1.3.0"
description = "UnionCrax.Direct - Tauri desktop app for managing and launching games"
authors = ["UnionCrax"]
license = "MIT"
repository = "https://github.com/Union-Crax/UnionCrax.Direct"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "unioncrax_direct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
futures-util = "0.3"
bytes = "1"
anyhow = "1"
url = "2"
urlencoding = "2"
base64 = "0.22"
which = "6"
discord-rpc-client = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "processthreadsapi", "tlhelp32", "fileapi", "minwinbase"] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
